<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visualization of neural activity in the human brain."
    />
    <title>Synapse</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
  </head>
  <body class="bg-black text-white font-jura">
    <div
      id="loader"
      class="fixed inset-0 z-50 grid place-items-center opacity-100 transition-opacity duration-700 ease-out bg-black/80"
    >
      <div
        class="flex flex-col items-center gap-4 transition-opacity duration-700"
      >
        <h1 class="text-4xl font-medium">Synapse</h1>
        <div id="loader-status" class="min-h-4.5 text-lg text-white/60">
          Loading...
        </div>
        <div class="-mt-2">
          Currently loading:
          <span id="loading-text" class="text-blue-300"></span>
        </div>
        <div id="loader-message" class="fixed bottom-5 text-xs text-white/40">
          - This might be a while...
        </div>
      </div>
    </div>
    <button
      id="settings-toggle"
      class="fixed bottom-5 right-5 z-20 flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-white/5 backdrop-blur-md transition hover:bg-white/10 text-white/30 hover:text-white/80 cursor-pointer"
      aria-label="Open settings"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-settings-icon lucide-settings"
      >
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <div
      id="settings-panel"
      class="fixed right-5 bottom-16 z-20 w-72 origin-bottom-right translate-y-3 scale-95 pointer-events-none opacity-0 rounded-lg border border-white/10 bg-black/50 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] transition-all duration-300 ease-in-out text-[13px]"
    >
      <div
        class="flex items-center justify-between border-b border-white/8 px-5 py-4"
      >
        <div class="font-medium">SETTINGS</div>
        <button
          id="settings-close"
          class="flex h-5 w-5 items-center justify-center text-white/30 transition hover:text-white cursor-pointer"
          aria-label="Close settings"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x-icon lucide-x"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="space-y-5 px-5 py-5">
        <div>
          <div class="mb-2.5 flex items-center justify-between">
            <label for="neuron-count">NEURONS</label>
            <span id="neuron-count-value" class="text-blue-300">3,000</span>
          </div>
          <input
            id="neuron-count"
            type="range"
            min="500"
            max="15000"
            step="500"
            value="3000"
            class="slider w-full"
          />
        </div>
        <div>
          <div class="mb-2.5 flex items-center justify-between">
            <label for="connection-count">CONNECTIONS</label>
            <span id="connection-count-value" class="text-blue-300">3</span>
          </div>
          <input
            id="connection-count"
            type="range"
            min="1"
            max="8"
            step="1"
            value="3"
            class="slider w-full"
          />
        </div>
        <div class="border-t border-white/8 pt-5 space-y-3">
          <label class="flex items-center justify-between cursor-pointer">
            <span>NEURONS</span>
            <input id="show-neurons" type="checkbox" checked class="toggle" />
          </label>
          <label class="flex items-center justify-between cursor-pointer">
            <span>CONNECTIONS</span>
            <input
              id="show-connections"
              type="checkbox"
              checked
              class="toggle"
            />
          </label>
        </div>
        <button
          id="settings-apply"
          class="w-full rounded-sm border border-blue-300/20 bg-blue-300/5 py-2.5 text-blue-200 transition hover:border-blue-300/40 hover:bg-blue-300/10 cursor-pointer"
        >
          APPLY
        </button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
