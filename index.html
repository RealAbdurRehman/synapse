<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visualization of neural activity in the human brain."
    />
    <title>Synapse</title>
  </head>
  <body class="bg-black">
    <div
      id="loader"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black"
    >
      <div class="w-80 text-center">
        <h1 class="text-3xl tracking-[0.5em] text-amber-50">SYNAPSE</h1>
        <p id="loader-status" class="mt-4 text-sm text-white/50">
          Initializing neural network...
        </p>
        <div class="mt-8 h-px w-full bg-white/10">
          <div
            id="loader-progress"
            class="h-full w-0 bg-white transition-[width] duration-200"
          ></div>
        </div>
        <p id="loader-percentage" class="mt-3 text-xs text-white/40">0%</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
