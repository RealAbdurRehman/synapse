<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visualization of neural activity in the human brain."
    />
    <title>Synapse</title>
  </head>
  <body class="bg-black">
    <div
      id="loader"
      class="fixed inset-0 z-10 flex items-center justify-center overflow-hidden bg-[#02040a] transition-all duration-1000 ease-[cubic-bezier(0.22,1,0.36,1)]"
    >
      <div
        class="pointer-events-none absolute left-1/2 top-1/2 h-125 w-125 -translate-x-1/2 -translate-y-1/2 rounded-full bg-blue-500/6 blur-[120px]"
      ></div>
      <div class="relative flex w-90 flex-col items-center">
        <div class="mb-8 text-center">
          <h1 class="text-3xl font-medium tracking-[0.35em] text-white/90">
            SYNAPSE
          </h1>
        </div>
        <div class="flex w-full items-center gap-4">
          <div class="h-0.5 flex-1 overflow-hidden bg-white/6">
            <div
              id="loader-progress"
              class="h-full w-0 bg-blue-300/80 shadow-[0_0_10px_rgba(100,180,255,0.8)] transition-[width] duration-300 ease-out"
            ></div>
          </div>
          <span
            id="loader-percentage"
            class="w-8 text-right font-mono text-[10px] tabular-nums text-white/40"
          >
            0%
          </span>
        </div>
        <div class="mt-3 w-full">
          <div
            class="font-mono text-[9px] tracking-[0.2em] text-white/35 text-center"
            id="loader-status"
          >
            INITIALIZING
          </div>
        </div>
      </div>
    </div>
    <button
      id="settings-toggle"
      class="fixed bottom-5 right-5 z-20 flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-white/5 text-white/20 backdrop-blur-md transition hover:bg-white/10 hover:text-white/80 cursor-pointer"
      aria-label="Open settings"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-settings-icon lucide-settings"
      >
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <div
      id="settings-panel"
      class="fixed right-5 bottom-16 z-20 w-72 origin-bottom-right translate-y-3 scale-95 pointer-events-none opacity-0 rounded-lg border border-white/10 bg-[#05070c]/05 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] backdrop-blur-xl transition-all duration-300 ease-[cubic-bezier(0.22,1,0.36,1)]"
    >
      <div
        class="flex items-center justify-between border-b border-white/8 px-5 py-4"
      >
        <div class="text-[11px] font-medium tracking-[0.25em] text-white/70">
          PARAMETERS
        </div>
        <button
          id="settings-close"
          class="flex h-5 w-5 items-center justify-center rounded-full text-white/30 transition hover:bg-white/10 hover:text-white cursor-pointer"
          aria-label="Close settings"
        >
          ×
        </button>
      </div>
      <div class="space-y-5 px-5 py-5">
        <div>
          <div class="mb-2.5 flex items-center justify-between">
            <label
              for="neuron-count"
              class="font-mono text-[10px] tracking-wider text-white/50"
            >
              NEURONS
            </label>
            <span
              id="neuron-count-value"
              class="font-mono text-[10px] tabular-nums text-blue-300"
            >
              3,000
            </span>
          </div>
          <input
            id="neuron-count"
            type="range"
            min="500"
            max="15000"
            step="500"
            value="3000"
            class="slider w-full"
          />
        </div>
        <div>
          <div class="mb-2.5 flex items-center justify-between">
            <label
              for="connection-count"
              class="font-mono text-[10px] tracking-wider text-white/50"
            >
              CONNECTIONS
            </label>
            <span
              id="connection-count-value"
              class="font-mono text-[10px] tabular-nums text-blue-300"
            >
              3
            </span>
          </div>
          <input
            id="connection-count"
            type="range"
            min="1"
            max="8"
            step="1"
            value="3"
            class="slider w-full"
          />
        </div>
        <button
          id="settings-apply"
          class="w-full rounded-sm border border-blue-300/20 bg-blue-300/5 py-2.5 font-mono text-[10px] tracking-[0.2em] text-blue-200 transition hover:border-blue-300/40 hover:bg-blue-300/10 cursor-pointer"
        >
          APPLY
        </button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
